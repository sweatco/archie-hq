# Slack app manifest. Default: HTTP webhook mode.
#
# To run Archie in Socket Mode instead (no public webhook URL needed):
#   1. Flip `socket_mode_enabled` to `true` near the bottom of this file
#      and re-import the manifest at https://api.slack.com/apps/<app>.
#   2. Generate an app-level token with the `connections:write` scope:
#      https://api.slack.com/apps/<app>/general → "App-Level Tokens".
#   3. Set `SLACK_APP_TOKEN=xapp-...` in the runtime environment.
#      Archie selects Socket Mode automatically when this var is present.
# The `request_url` fields are ignored by Slack when Socket Mode is on,
# so they can stay as-is for environments that toggle between modes.

display_information:
  name: Archie
  description: 'Autonomous Responsive and Collaborative Hyper Intelligent Employee'
  background_color: '#2c2d30'
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
    agent_tasks_enabled: false
  bot_user:
    display_name: Archie
    always_online: true
  agent_view:
    agent_description: 'Autonomous Responsive and Collaborative Hyper Intelligent Employee'
    suggested_prompts: []
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - users:read
      - users:read.email
      - usergroups:read
      - files:read
      - files:write
      - pins:read
      - reactions:read
      - reactions:write
      - assistant:write
settings:
  interactivity:
    is_enabled: true
    request_url: https://your-domain.example.com/webhooks/slack
  event_subscriptions:
    request_url: https://your-domain.example.com/webhooks/slack
    bot_events:
      - agent_session_stopped
      - app_mention
      - member_joined_channel
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
