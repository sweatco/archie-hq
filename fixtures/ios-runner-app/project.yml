name: RunnerFixture
options:
  bundleIdPrefix: dev.archie
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    SWIFT_VERSION: "5.0"
    SUPPORTED_PLATFORMS: iphonesimulator
    TARGETED_DEVICE_FAMILY: "1"
targets:
  RunnerFixture:
    type: application
    platform: iOS
    sources:
      - RunnerFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.archie.runner-fixture
        PRODUCT_NAME: RunnerFixture
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RunnerFixture
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  RunnerFixtureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RunnerFixtureTests
    dependencies:
      - target: RunnerFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.archie.runner-fixture-tests
        GENERATE_INFOPLIST_FILE: YES
  RunnerFixtureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RunnerFixtureUITests
    dependencies:
      - target: RunnerFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.archie.runner-fixture-ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RunnerFixture
schemes:
  RunnerFixture:
    build:
      targets:
        RunnerFixture: all
        RunnerFixtureTests:
          - test
        RunnerFixtureUITests:
          - test
    test:
      gatherCoverageData: true
      targets:
        - RunnerFixtureTests
        - RunnerFixtureUITests
