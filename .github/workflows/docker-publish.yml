name: Publish Docker image

on:
  push:
    branches:
      - main
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build and publish image
    runs-on: ubuntu-latest
    # A pull request publishes only on the `build-image` label. Forks cannot push an image.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.label.name == 'build-image' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
    env:
      # On a pull request github.sha is a merge commit; the deploy job expects the branch head.
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tag
        id: image_tag
        shell: bash
        run: |
          # The deploy job looks the image up under this form of the branch name.
          branch="$(
            printf '%s' "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" |
              sed 's/[^a-zA-Z0-9-]/-/g' |
              tr '[:upper:]' '[:lower:]'
          )"
          echo "tag=${REGISTRY}/${IMAGE_NAME}:${branch}-${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and publish Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.image_tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the published image
        shell: bash
        env:
          TAG: ${{ steps.image_tag.outputs.tag }}
        run: echo "Published \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

  # A separate job, so the build gets no write access to pull requests.
  unlabel:
    name: Remove the build-image label
    runs-on: ubuntu-latest
    needs: docker
    # Also after a failed build, so the label can be added again.
    if: always() && github.event_name == 'pull_request' && needs.docker.result != 'skipped'
    permissions:
      pull-requests: write

    steps:
      - name: Remove the label
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          gh api --method DELETE --silent \
            "repos/${GITHUB_REPOSITORY}/issues/${PULL_REQUEST}/labels/build-image" ||
            echo "The label was already gone."
