# Archie HQ - Docker Compose (local development)
#
# Usage: npm run docker:dev
#
# Setup:
#   1. Copy .env.example to .env and fill in your values
#   2. Symlink plugins and pre-clone repos into workdir/ (see docs/guides/local-development.md)
#   3. Ensure your SSH key is loaded: ssh-add
#
# Logs:
#   docker compose logs -f          # Follow all logs
#   docker compose logs -f archie   # Follow archie logs only
#
# ngrok (in separate terminal):
#   ngrok http 3000
#   Then update Slack app Request URL to: https://xxxx.ngrok.io/webhooks/slack
#   (the runtime logs the live path at boot: "Slack webhook: POST /webhooks/slack")

services:
  # Model gateway: speaks the Anthropic Messages API and translates to whichever
  # upstream serves the requested model, so agents can run on non-Claude models
  # with no change to the spawned CLI. Inert unless ARCHIE_MODEL_GATEWAY_URL is
  # set — archie talks to api.anthropic.com directly when it is unset.
  #
  # Reachable from archie as http://litellm:4000. Do NOT use
  # host.docker.internal: measured unreachable from a container on this host.
  #
  # Pinned deliberately: the streaming hook in docker/litellm relies on
  # /v1/messages reaching async_post_call_streaming_iterator_hook as raw SSE.
  # Re-run a live task after changing this tag.
  litellm:
    # Never starts unless the profile is active, so a plain `docker compose up`
    # runs archie alone and this is inert for anyone not experimenting. Enable
    # with COMPOSE_PROFILES=model-gateway in .env (or --profile model-gateway).
    profiles: ["model-gateway"]
    # Same image production runs — config and hook baked in, no bind mounts.
    build:
      context: ./docker/litellm
    image: archie-model-gateway:local
    # The arm64 LiteLLM base crashes on start (SIGILL) on Apple Silicon; the
    # amd64 one runs fine under emulation and is native on amd64 hosts.
    platform: linux/amd64
    restart: unless-stopped
    # Only the two variables the gateway needs — NOT env_file: .env, which would
    # hand it every Slack and GitHub secret Archie holds.
    environment:
      # Empty defaults, not `:?` — compose interpolates inactive-profile
      # services too, so a required-variable form would break `up` for
      # every deployment that is not running the gateway.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
    # Not published to the host: only archie needs to reach it.
    expose:
      - "4000"

  archie:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"

    # Capabilities for bubblewrap sandbox (full namespace isolation)
    # SYS_ADMIN: namespace creation and mount ops
    # seccomp/apparmor unconfined: allows bwrap's pivot_root and mount syscalls
    # systempaths unconfined: removes /proc masking so bwrap can mount fresh procfs
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined

    # Environment variables from .env file
    env_file:
      - .env

    # Override paths for containerized environment
    environment:
      # Make the shell's PORT authoritative inside the container too — env_file
      # (.env) would otherwise pin the app to its PORT while the mapping above
      # follows the shell, silently splitting the two on an override.
      - PORT=${PORT:-3000}
      # Checkout attestation: the e2e harness passes the composing checkout's
      # commit SHA; /health reports it so boot can verify the instance runs the
      # code under test (src/ is bind-mounted, so compose-time attestation holds).
      - GIT_SHA=${GIT_SHA:-}
      - CLAUDE_PATH=/usr/local/bin/claude
      - ARCHIE_WORKDIR=/workdir
      # - GITHUB_APP_PRIVATE_KEY_PATH=/app/secrets/github-private-key.pem
      - SSH_AUTH_SOCK=/run/host-services/ssh-auth.sock
      - NODE_ENV=development

    volumes:
      # Workdir mount — contains repos/, sessions/, caches/, triggers/, triggers-data/
      - ./workdir:/workdir

      # Plugins — mounted explicitly because workdir/plugins is a symlink
      - ./workdir/plugins:/workdir/plugins

      # Mount source code for hot reload
      - ./src:/app/src
      - ./prompts:/app/prompts
      # Core skills, which src/agents/core-skills.ts mounts from /app/skills per its CORE_SKILL_MOUNTS manifest, and only if that directory exists. Dockerfile.dev never copies them, so this bind mount is their only source in dev — without it every core-skill `Skill` call fails with "Unknown skill".
      - ./skills:/app/skills

      # SSH agent forwarding (macOS Docker Desktop)
      - /run/host-services/ssh-auth.sock:/run/host-services/ssh-auth.sock

      # Secrets - mounts deploy-time secrets (GitHub App key) AND runtime
      # OAuth tokens written by `oauth:connect`. Read-write so the daemon
      # can persist refreshed tokens.
      - ./secrets:/app/secrets

      # Claude Code config - stores API keys, sessions, settings
      - ./claude-data:/home/archie/.claude
      - ./claude-data/.claude.json:/home/archie/.claude.json

      # Exclude node_modules (use container's version)
      - /app/node_modules

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${PORT:-3000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
