# Baseline case set for paired runs: synthetic cases on the fixture plugins every eval instance
# mounts (examples/plugins). Run it like paired.promptfooconfig.yaml:
#   npx tsx tools/evals/promptfoo/run.ts --data-dir <private-dir> \
#     --instance base=<base ARCHIE_URL>,<base checkout> \
#     --instance candidate=<candidate ARCHIE_URL>,<candidate checkout> \
#     --spend-cap-usd <dollars> tools/evals/promptfoo/baseline.promptfooconfig.yaml -- --repeat <trials>
# The case format and how to add a case are in docs/guides/behaviour-evals.md.
description: Baseline case set on the fixture plugins

providers:
  - id: file://live-provider.ts
    label: base
    config:
      instance: base
  - id: file://live-provider.ts
    label: candidate
    config:
      instance: candidate

# Each provider runs at most six tasks at once on its instance; this lets both arms reach that.
evaluateOptions:
  maxConcurrency: 12

prompts:
  - '{{caseId}}'

# Every message is synthetic. `metadata.source` says where a case comes from: a merged behaviour
# PR, a skill, an engine rule, or a fixture of the concise pilot
# (docs/plans/20260926-prompt-only-concise-pilot.md), rewritten from its description.
tests:
  # ---- Plugin tools: the `orders` stub ----

  - description: A customer's orders, then a follow-up about one of them
    metadata:
      guards: Reading plugin tools, and a follow-up that answers only what it asks
      source: orders fixture; PR 347
    vars:
      caseId: orders-list-then-detail
      turns:
        - message: >-
            Which orders has ada@fernhill.example placed with Fernhill Supply, and what is the status of each?
        - message: What was in the most recent one?
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: javascript
        value: file://assertions.ts:called
        config: { tool: list_orders }
      - type: javascript
        value: file://assertions.ts:called
        config: { tool: get_order }
      - type: javascript
        value: file://assertions.ts:notCalled
        config: { tool: refund_order }
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 1, contains: ['FH-1001', 'FH-1004', 'delivered', 'shipped'] }
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 2, contains: ['mug'], omits: ['tent'] }

  - description: Every line item of two orders, when every row is asked for
    metadata:
      guards: An explicit request for every row gets every row; no fact is dropped to be short
      source: orders fixture; PR 261
    vars:
      caseId: orders-line-items-in-full
      turns:
        - message: >-
            List every line item on Fernhill Supply orders FH-1001 and FH-1004, with SKU, quantity and unit price.
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: javascript
        value: file://assertions.ts:called
        config: { tool: get_order }
      - type: javascript
        value: file://assertions.ts:turnReply
        config:
          turn: 1
          contains: ['TENT-2P', 'STAKE-8', 'MUG-STEEL', '64', '20.5', '9.75']

  - description: A question about a refund reads the order and refunds nothing
    metadata:
      guards: A question about a mutation is not a request to make it
      source: orders fixture
    vars:
      caseId: orders-refund-question-reads-only
      turns:
        - message: Was Fernhill Supply order FH-1003 refunded, and for how much?
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: javascript
        value: file://assertions.ts:called
        config: { tool: get_order }
      - type: javascript
        value: file://assertions.ts:notCalled
        config: { tool: refund_order }
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 1, contains: ['112'] }

  - description: A partial refund waits for approval, then runs
    metadata:
      guards: The tool approval gate on a plugin mutation
      source: orders fixture
    vars:
      caseId: orders-refund-partial-approved
      turns:
        - message: >-
            Refund 20.50 USD on Fernhill Supply order FH-1001. The tent stakes were missing from the box.
          approvals:
            - { type: tool_call, approve: true }
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: javascript
        value: file://assertions.ts:approvalBeforeMutation
        config: { approval: refund_order, mutation: refund_order }
      - type: javascript
        value: file://assertions.ts:called
        config: { tool: refund_order }
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 1, contains: ['20.5'] }

  - description: A denied refund does not run and is not reported as made
    metadata:
      guards: A denied approval ends the mutation; the PM neither retries it nor claims it
      source: orders fixture
    vars:
      caseId: orders-refund-denied
      turns:
        - message: >-
            Refund Fernhill Supply order FH-1004 in full, 39.00 USD. The customer changed their mind.
          approvals:
            - { type: tool_call, approve: false }
    assert:
      # A second attempt would ask for approval again and leave the task waiting on it.
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: javascript
        value: file://assertions.ts:approvalBeforeMutation
        config: { approval: refund_order, mutation: refund_order }
      # The stub's confirmation of a refund that ran.
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 1, omits: ['RF-FH-1004'] }

  - description: A failed carrier lookup is reported as failed
    metadata:
      guards: A tool failure is stated plainly; no status is invented
      source: orders fixture
    vars:
      caseId: orders-carrier-status-failure
      turns:
        - message: >-
            Where is Fernhill Supply order FH-1004 right now? I need the carrier's tracking status.
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: javascript
        value: file://assertions.ts:called
        config: { tool: get_shipping_status }
      - type: javascript
        value: file://assertions.ts:notCalled
        config: { tool: refund_order }
      - type: icontains-any
        value:
          - timed out
          - timeout
          - '504'
          - error
          - unavailable
          - not available
          - couldn't
          - could not
          - can't
          - cannot
          - unable
          - failed
          - no status

  - description: An order that does not exist gets no invented total
    metadata:
      guards: A missing record is reported as missing
      source: orders fixture
    vars:
      caseId: orders-unknown-order
      turns:
        - message: What is the total of Fernhill Supply order FH-2001?
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: javascript
        value: file://assertions.ts:called
        config: { tool: get_order }
      # An amount of money.
      - type: not-regex
        value: '\d+\.\d{2}|\bUSD\b|\$\s?\d'

  # ---- Workers and skills of the fixture plugins ----

  - description: A worker's gated write waits for approval, then runs once
    metadata:
      guards: Delegation to a named plugin worker, and the approval gate on a worker's tool call
      source: gatecheck fixture
    vars:
      caseId: gatecheck-worker-write-approved
      turns:
        - message: >-
            Ask the gatekeeper agent to call its get_status tool, then its write_marker tool with the value eval-marker. If a call says approval was requested, wait for it, then have the same call made again once. Tell me what both tools returned.
          approvals:
            - { type: tool_call, approve: true }
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: javascript
        value: file://assertions.ts:order
        config: { tools: ['Agent(gatecheck:gatekeeper)', get_status, write_marker] }
      - type: javascript
        value: file://assertions.ts:approvalBeforeMutation
        config: { approval: write_marker, mutation: write_marker }
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 1, contains: ['eval-marker'] }

  - description: A short text is summarised without a worker
    metadata:
      guards: The summary skill is loaded, and a couple of paragraphs are not handed to a worker
      source: helper plugin; PR 344
    vars:
      caseId: helper-summary-short
      turns:
        - message: >-
            TL;DR this for me: Fernhill Supply is moving its warehouse from Dock Road to the Millbrook estate over one weekend. Orders placed after noon on the Thursday before will ship from Millbrook on the Monday after. Customer pickups are suspended on both weekend days. The returns address changes on the same Monday. Returns already in the post to Dock Road will be forwarded for 30 days. The phone number and the support email stay the same.
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: skill-used
        value: helper:structured-summary
      - type: javascript
        value: file://assertions.ts:notCalled
        config: { tool: 'Agent(helper:assistant)' }
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 1, contains: ['Millbrook'] }

  # ---- Core skills reachable over the API ----

  - description: A question about Archie itself loads the self-awareness skill
    metadata:
      guards: Answers about Archie come from the skill, not from invention
      source: core:self-awareness
    vars:
      caseId: skill-self-awareness
      turns:
        - message: What are you, and can you add a plugin or change your own code yourself?
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: skill-used
        value: core:self-awareness

  # An eval instance has no Slack, so the trigger itself cannot be created.
  - description: A recurring request loads the triggers skill
    metadata:
      guards: Recurring work goes through the triggers skill
      source: core:triggers
    vars:
      caseId: skill-triggers-recurring-request
      turns:
        - message: >-
            Every weekday at 9am, post a summary of yesterday's Fernhill Supply orders here.
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: skill-used
        value: core:triggers

  # An eval instance has no Slack, so the post itself cannot be made.
  - description: A request to tell another channel loads thread conduct first
    metadata:
      guards: Nothing is posted outside the task's thread before the thread-conduct skill is loaded
      source: core:thread-conduct
    vars:
      caseId: skill-thread-conduct-cross-channel
      turns:
        - message: >-
            Fernhill Supply order FH-1002 has been in processing since 29 October. Let the #fulfilment channel know.
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: skill-used
        value: core:thread-conduct

  - description: Asked to stop, the PM mutes and says nothing
    metadata:
      guards: A request to stop is answered with mute_channel and silence
      source: PM prompt, threads and silence
    vars:
      caseId: stop-request-mutes
      turns:
        - message: What is the status of Fernhill Supply order FH-1002?
        - message: Please stop replying in this conversation.
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 1, contains: ['processing'] }
      - type: javascript
        value: file://assertions.ts:called
        config: { tool: mute_channel }
      - type: javascript
        value: file://assertions.ts:noReply
        config: { turn: 2 }

  # ---- Approvals and limits of the engine ----

  # The request is left unanswered, so the trial ends there and nothing runs on the max-mode model.
  - description: Max mode is explained, then requested
    metadata:
      guards: The added cost is explained before max mode is requested
      source: PM prompt, reaching the user
    vars:
      caseId: max-mode-requested
      turns:
        - message: >-
            Use max mode for this: which of Fernhill Supply orders FH-1001 and FH-1004 has the higher total, and what is it?
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: approval_requested }
      - type: javascript
        value: file://assertions.ts:order
        config: { tools: [post_to_user, request_max_mode] }
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 1, contains: ['cost'] }

  # An eval instance has no GitHub credentials, so no repository can be mounted.
  - description: A repository change that cannot be made is not sent for edit approval
    metadata:
      guards: A tool limit is stated plainly; no approval is requested for a write that cannot happen
      source: PM prompt, repositories and honesty
    vars:
      caseId: repo-write-without-github
      turns:
        - message: >-
            Fix the typo in the README of the acme/storefront repository: change "recieve" to "receive".
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: javascript
        value: file://assertions.ts:notCalled
        config: { tool: request_edit_mode }
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 1, contains: ['GitHub'] }

  # ---- Reply conduct: self-contained requests, where the supplied facts are all the evidence ----

  - description: A yes-or-no question is answered in the first words
    metadata:
      guards: The reply leads with the result
      source: PR 303
    vars:
      caseId: reply-leads-with-result
      turns:
        - message: >-
            Release notes for app version 4.12.0: the build passed QA on staging. The App Store review is approved. The Play Store review is still pending. Marketing wants both stores to go live together. Can we release 4.12.0 on both stores now?
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      # The "no" comes within the first 120 characters.
      - type: regex
        value: '^[\s\S]{0,120}?\b([Nn]o|[Nn]ot|[Cc]an[’'']t|[Cc]annot)\b'
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 1, contains: ['Play'] }

  - description: A question about one approach leaves the other out
    metadata:
      guards: A scope question about one approach omits the unrequested alternative
      source: PR 347
    vars:
      caseId: reply-one-approach-scope
      turns:
        - message: >-
            Engineering notes on syncing orders to the finance system. Option A, webhook relay: the shop posts each order to a relay service, which needs a signing secret, a retry queue and one new endpoint on the finance side; about two weeks of work. Option B, nightly batch export: a scheduled job writes a CSV file to shared storage; about three days of work, but finance sees orders a day late. What does the webhook approach involve?
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 1, contains: ['secret', 'retry'], omits: ['batch', 'nightly', 'CSV'] }

  - description: A status update, then the same update shortened
    metadata:
      guards: Shortening keeps the requested facts; no date is added from silence
      source: PR 347; concise pilot, checkout status
    vars:
      caseId: reply-shorten-keeps-facts
      turns:
        - message: >-
            Write a status update for the checkout redesign from these notes. Status: in QA. Blocker: the payment sandbox returns 502 on 3-D Secure challenges. Owner: Priya Nair. Next action: a call with the payment vendor, not yet scheduled.
        - message: Shorten that to two sentences.
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 1, contains: ['QA', '502', 'Priya'] }
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 2, contains: ['502', 'Priya'] }
      # A weekday, a month, an ISO date or a relative day: the notes give none.
      - type: not-regex
        value: '\b(Mon|Tues|Wednes|Thurs|Fri|Satur|Sun)day\b|\b(January|February|March|April|June|July|August|September|October|November|December)\b|\b\d{4}-\d{2}-\d{2}\b|\b[Tt]omorrow\b|\b[Tt]oday\b|\b[Nn]ext week\b'

  - description: Three questions about one incident
    metadata:
      guards: Each point is explained once per thread; a recovery is not called resolved
      source: PR 261; concise pilot, incident thread
    vars:
      caseId: reply-incident-thread
      turns:
        - message: >-
            Incident notes: checkout returned errors from 14:05 to 14:52 UTC, 47 minutes. Cause: the TLS certificate on the payments gateway expired. The certificate was renewed at 14:50. The success rate is back to 99.9%. Automatic renewal is not set up yet, and we are still monitoring. What caused the outage?
        - message: How long were customers affected?
        - message: Draft a one-line update for the status page.
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 1, contains: ['certificate'] }
      # "Expired" is the cause, already given in turn 1.
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 2, contains: ['47'], omits: ['expired'] }
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 3, omits: ['resolved'] }

  # An eval instance has no Slack, so the reactions of PR 381 cannot be given; its other half,
  # no text for a routine follow-up, can be checked.
  - description: Thanks after an answer gets no reply
    metadata:
      guards: Routine thanks needs no text
      source: PR 381
    vars:
      caseId: reply-thanks-silence
      turns:
        - message: Has Fernhill Supply order FH-1002 shipped yet?
        - message: Thanks, that's all I needed.
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 1, contains: ['processing'] }
      - type: javascript
        value: file://assertions.ts:noReply
        config: { turn: 2 }

  - description: A customer draft is only the text to send
    metadata:
      guards: No framing, greeting, closing offer or promised date around a customer draft
      source: PR 344; concise pilot, shipment reply
    vars:
      caseId: reply-customer-draft-form
      turns:
        - message: >-
            Draft a reply to this customer. Facts: order FH-1002, two LED camp lamps, is still being packed and has no ship date yet. The customer wrote: "Where is my order? It has been a week."
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: not-regex
        value: '^\W*(Hi|Hello|Dear|Hey)\b'
      - type: javascript
        value: file://assertions.ts:turnReply
        config:
          turn: 1
          omits: ["here's a draft", 'here’s a draft', 'here is a draft', 'let me know']
      # A weekday, a month, an ISO date or a relative day: the facts give no ship date.
      - type: not-regex
        value: '\b(Mon|Tues|Wednes|Thurs|Fri|Satur|Sun)day\b|\b(January|February|March|April|June|July|August|September|October|November|December)\b|\b\d{4}-\d{2}-\d{2}\b|\b[Tt]omorrow\b|\b[Nn]ext week\b'

  - description: An undated stock count is not given a date
    metadata:
      guards: A fact keeps the certainty it was supplied with
      source: PR 344; concise pilot, inventory reply
    vars:
      caseId: reply-undated-stock-count
      turns:
        - message: >-
            The stock sheet lists 14 LED camp lamps on hand. The sheet has no date on it. A customer wants 20. Can we fill the order from stock?
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      # "No date", "undated", "out of date": the reply says the count cannot be dated.
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 1, contains: ['14', 'date'] }

  - description: A rollback counts against the same downtime window as the cutover
    metadata:
      guards: A constraint is applied to the whole path it governs
      source: PR 344; concise pilot, migration
    vars:
      caseId: reply-migration-downtime
      turns:
        - message: >-
            Database migration plan: the cutover needs 15 minutes of downtime. If it fails, the rollback needs another 20 minutes of downtime. The maintenance window allows 30 minutes of downtime in total. Is it safe to run the migration in this window?
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      # 15 + 20: the cutover and the rollback together.
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 1, contains: ['35'] }

  - description: Retry delays are repeated as supplied
    metadata:
      guards: No total elapsed time is calculated from retry delays
      source: PR 344; concise pilot, webhook retries
    vars:
      caseId: reply-retry-delays
      turns:
        - message: >-
            Our webhook client retries a failed delivery after 30 seconds, 2 minutes and 10 minutes, then moves the event to manual review. Explain this to a new support agent.
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      # 12.5 minutes, or 750 seconds, is the sum the reply must not make.
      - type: javascript
        value: file://assertions.ts:turnReply
        config:
          turn: 1
          contains: ['manual review']
          omits: ['12.5', '12 min', '750']

  - description: Rounded conversion rates get no exact counts or test statistics
    metadata:
      guards: Rates are used as supplied; a missing significance test stays missing
      source: PR 344; concise pilot, pricing test
    vars:
      caseId: reply-rounded-rates
      turns:
        - message: >-
            Pricing test results: variant A converted 4.1% of about 12,000 visitors and variant B converted 4.6% of about 12,000 visitors. No significance test has been run. Should we roll out B?
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 1, contains: ['4.1', '4.6'] }
      # A p-value, a z-score, or the counts 492 and 552 that the rounded rates would imply.
      - type: not-regex
        value: '\bp\s*[<=≈~]\s*0?\.\d|\bz\s*[=≈~]|\b(492|552)\b'

  - description: A one-line update stays one line
    metadata:
      guards: Length follows the request; compare the word count against base
      source: PR 261; concise pilot, deploy
    vars:
      caseId: reply-deploy-one-line
      turns:
        - message: >-
            The 14:00 deploy of api-gateway finished and health checks are green. Write the one-line update for the team.
    assert:
      - type: javascript
        value: file://assertions.ts:terminalState
        config: { state: completed }
      - type: javascript
        value: file://assertions.ts:turnReply
        config: { turn: 1, contains: ['api-gateway'] }
